name: kubectl

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 5,17 * * *'

concurrency:
  group: kubectl-images-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: docker
    container: {image: ubuntu:24.04}
    timeout-minutes: 60
    env:
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    strategy:
      matrix:
        version: [v1.24.4, v1.23.10]
    steps:
      - name: Bootstrap JavaScript actions
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates docker.io git nodejs python3
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Register ARM64 binfmt support
        uses: https://github.com/docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: https://github.com/docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}
      - name: Configure Forgejo image reference
        id: forgejo-image
        shell: bash
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          IMAGE_TAG: ${{ matrix.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          server = urlsplit(os.environ['FORGEJO_SERVER_URL'])
          if server.scheme != 'https' or not server.hostname or server.username or server.password:
              raise SystemExit('Expected an HTTPS Forgejo server URL without credentials')
          registry = server.netloc.lower()
          repository = os.environ['FORGEJO_REPOSITORY'].lower()
          image = f"{registry}/{repository}/kubectl:{os.environ['IMAGE_TAG']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'registry={registry}\nref={image}\n')
          PY
      - name: Log in to Forgejo registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.forgejo-image.outputs.registry }}
          username: ${{ secrets.FORGEJO_REGISTRY_USERNAME || forgejo.repository_owner }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: Images/KubeCTL
          cache-from: type=registry,ref=kristianfjones/kubectl:${{ matrix.version }}
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ matrix.version }}
          push: ${{ forgejo.ref == 'refs/heads/main' }}
          tags: |
            kristianfjones/kubectl:${{ matrix.version }}
            ${{ steps.forgejo-image.outputs.ref }}
