name: Core Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 5,17 * * *'

permissions:
  contents: read

concurrency:
  group: daily-images-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: docker
    container: {image: ubuntu:24.04}
    timeout-minutes: 180
    env:
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - context: Images/Kea
            name: kea
            cache: kristianfjones/kea:vps1-core
            platforms: linux/amd64
            tag: kristianfjones/kea:vps1-core

          - context: Images/NetBox
            name: netbox
            cache: kristianfoss/netbox:core
            platforms: linux/amd64,linux/arm64
            tag: kristianfoss/netbox:core

          - context: Images/UPNP
            name: upnp
            cache: kristianfjones/upnp:jobs
            platforms: linux/amd64
            tag: kristianfjones/upnp:jobs

          - context: Images/PGPool
            name: pgpool
            cache: kristianfjones/pgpool:latest
            platforms: linux/amd64
            tag: kristianfjones/pgpool:latest


          - context: Images/Postfix
            name: postfix
            cache: kristianfoss/postfix:core
            platforms: linux/amd64,linux/arm64
            tag: kristianfoss/postfix:core

    steps:
      - name: Bootstrap JavaScript actions
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates docker.io git nodejs python3
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Register ARM64 binfmt support
        uses: https://github.com/docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: https://github.com/docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}
      - name: Configure Forgejo image reference
        id: forgejo-image
        shell: bash
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          server = urlsplit(os.environ['FORGEJO_SERVER_URL'])
          if server.scheme != 'https' or not server.hostname or server.username or server.password:
              raise SystemExit('Expected an HTTPS Forgejo server URL without credentials')
          registry = server.netloc.lower()
          repository = os.environ['FORGEJO_REPOSITORY'].lower()
          tag = os.environ['IMAGE_TAG'].rsplit(':', 1)[1]
          image = f"{registry}/{repository}/{os.environ['IMAGE_NAME']}:{tag}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'registry={registry}\nref={image}\n')
          PY
      - name: Log in to Forgejo registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.forgejo-image.outputs.registry }}
          username: ${{ secrets.FORGEJO_REGISTRY_USERNAME || forgejo.repository_owner }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          cache-from: type=registry,ref=${{ matrix.cache }}
          cache-to: type=inline
          platforms: ${{ matrix.platforms }}
          push: ${{ forgejo.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.tag }}
            ${{ steps.forgejo-image.outputs.ref }}

  dockerhub-description:
    needs: docker
    if: ${{ forgejo.ref == 'refs/heads/main' }}
    runs-on: docker
    container: {image: ubuntu:24.04}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - repository: kristianfjones/kea
            readme: Images/Kea/README.md
          - repository: kristianfoss/netbox
            readme: Images/NetBox/README.md
    steps:
      - name: Bootstrap JavaScript actions
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git nodejs
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update Docker Hub description
        uses: https://github.com/peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}
          repository: ${{ matrix.repository }}
          readme-filepath: ${{ matrix.readme }}
          enable-url-completion: true
